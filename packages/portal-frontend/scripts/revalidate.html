<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Revalidate Page</title>
  <style>
    body { font-family: monospace; max-width: 560px; margin: 60px auto; padding: 0 16px; background: #111; color: #eee; }
    h1 { font-size: 18px; margin-bottom: 24px; }
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; background: #1e1e1e; border: 1px solid #333; color: #eee; font-family: monospace; font-size: 14px; border-radius: 4px; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #555; }
    button { padding: 8px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-family: monospace; font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #preview { margin-top: 16px; font-size: 12px; color: #888; word-break: break-all; }
    #preview span { color: #60a5fa; }
    #result { margin-top: 20px; padding: 10px; border-radius: 4px; font-size: 13px; display: none; }
    #result.ok { background: #14532d; color: #86efac; }
    #result.err { background: #450a0a; color: #fca5a5; }
  </style>
</head>
<body>
  <h1>ISR Revalidate</h1>

  <label>Page URL (full, e.g. https://portal.repliers.com/buildings/king-west)</label>
  <input id="url" type="url" placeholder="https://..." autofocus />

  <label>Token (REVALIDATE_TOKEN)</label>
  <input id="token" type="password" placeholder="secret" />

  <button onclick="submit()">Revalidate</button>

  <div id="preview"></div>
  <div id="result"></div>

  <script>
    const urlInput = document.getElementById('url')
    const tokenInput = document.getElementById('token')
    const preview = document.getElementById('preview')
    const result = document.getElementById('result')

    urlInput.addEventListener('input', updatePreview)
    tokenInput.addEventListener('input', updatePreview)

    function buildApiUrl() {
      const raw = urlInput.value.trim()
      const token = tokenInput.value.trim()
      if (!raw) return null
      try {
        const parsed = new URL(raw)
        const path = parsed.pathname || '/'
        const apiUrl = new URL('/api/revalidate', parsed.origin)
        apiUrl.searchParams.set('path', path)
        if (token) apiUrl.searchParams.set('token', token)
        return apiUrl.toString()
      } catch {
        return null
      }
    }

    function updatePreview() {
      const api = buildApiUrl()
      preview.innerHTML = api
        ? `→ <span>${api}</span>`
        : ''
    }

    async function submit() {
      const api = buildApiUrl()
      result.style.display = 'none'
      if (!api) {
        show('err', 'Invalid URL')
        return
      }
      try {
        const res = await fetch(api, { redirect: 'manual' })
        if (res.type === 'opaqueredirect' || res.status === 0 || (res.status >= 200 && res.status < 400)) {
          show('ok', `✓ Revalidated — ${res.status || 'redirect'}`)
        } else {
          const body = await res.json().catch(() => ({ error: res.statusText }))
          show('err', `${res.status} — ${body.error}`)
        }
      } catch (e) {
        show('err', String(e))
      }
    }

    function show(type, msg) {
      result.className = type
      result.textContent = msg
      result.style.display = 'block'
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') submit()
    })
  </script>
</body>
</html>
