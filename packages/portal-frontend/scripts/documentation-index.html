<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Portal Documentation</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    />
    <!--
      Same identity as both docs sites: accent from packages/docs/app/globals.css,
      backgrounds from Nextra's defaults, card borders from the docs' table/image
      border tokens (Nextra gray-300 / gray-600).
    -->
    <style>
      :root {
        color-scheme: light;
        --bg: rgb(250 250 250);
        --border: oklch(87.2% 0.01 258.338);
        --accent: hsl(162deg 39% 38%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: rgb(17 17 17);
          --border: oklch(44.6% 0.03 256.802);
          --accent: hsl(162deg 39% 52%);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        font-family:
          Poppins, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 720px;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 32px;
        font-size: 1.75rem;
        line-height: 2.25rem;
        font-weight: 600;
      }
      nav {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }
      a {
        display: block;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--accent);
      }
      h2 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 600;
        color: var(--accent);
      }
      p {
        margin: 0;
        line-height: 1.5rem;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <img src="/logo.svg" alt="" width="32" height="32" />
        Portal Documentation
      </h1>
      <nav>
        <a href="/documentation/frontend">
          <h2>Portal Docs</h2>
          <p>
            Getting started, product guide, technical guide and tutorials for
            the portal frontend.
          </p>
        </a>
        <a href="/documentation/backend">
          <h2>Portal Backend Docs</h2>
          <p>
            Getting started, architecture, API reference, integrations and
            operations of the proxy backend.
          </p>
        </a>
      </nav>
    </main>
  </body>
</html>
